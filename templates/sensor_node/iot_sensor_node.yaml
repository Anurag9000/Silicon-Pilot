updated_at: "2026-02-06"

use_cases:
  - "Smart agriculture soil monitoring"
  - "Smart city environmental monitoring"
  - "Industrial asset tracking"
  - "Wildlife tracking"
  - "Remote weather stations"

example_products:
  - "Adafruit Feather M0 LoRa"
  - "RAK Wireless WisNode"
  - "Dragino LoRa Shield"

references:

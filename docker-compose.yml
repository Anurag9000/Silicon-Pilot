version: '3.8'

services:
  # PostgreSQL database with schema initialization
  postgres:
    image: postgres:16-alpine
    container_name: hardwaregenius_postgres
    environment:
      POSTGRES_DB: hardwaregenius
      POSTGRES_USER: hg_user
      POSTGRES_PASSWORD: hg_password
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hg_user -d hardwaregenius"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hardwaregenius_network

  # MinIO for S3-compatible object storage (PDFs, evidence snippets)
  minio:
    image: minio/minio:latest
    container_name: hardwaregenius_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hardwaregenius_network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: hardwaregenius_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hardwaregenius_network

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardwaregenius_backend
    environment:
      # Database
      DATABASE_URL: postgresql://hg_user:hg_password@postgres:5432/hardwaregenius
      
      # S3 Storage
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_DOCUMENTS: hardwaregenius-documents
      S3_BUCKET_EVIDENCE: hardwaregenius-evidence
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # LLM
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # App config
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /app/__pycache__
      - /app/.pytest_cache
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - hardwaregenius_network

  # Celery worker for ingestion pipeline
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardwaregenius_worker
    environment:
      DATABASE_URL: postgresql://hg_user:hg_password@postgres:5432/hardwaregenius
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_DOCUMENTS: hardwaregenius-documents
      S3_BUCKET_EVIDENCE: hardwaregenius-evidence
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app
    command: celery -A ingestion.worker worker --loglevel=info
    networks:
      - hardwaregenius_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  hardwaregenius_network:
    driver: bridge

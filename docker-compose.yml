version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: siliconpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1Anurag2Basistha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/component_tables.sql:/docker-entrypoint-initdb.d/02-component_tables.sql
      - ./database/errata_schema.sql:/docker-entrypoint-initdb.d/03-errata.sql
      - ./database/reference_design_schema.sql:/docker-entrypoint-initdb.d/04-reference_designs.sql
      - ./database/pin_mux_schema.sql:/docker-entrypoint-initdb.d/05-pin_mux.sql
      - ./database/power_budget_schema.sql:/docker-entrypoint-initdb.d/06-power_budget.sql
      - ./database/firmware_stack_schema.sql:/docker-entrypoint-initdb.d/07-firmware_stacks.sql
      - ./database/ml_ranking_schema.sql:/docker-entrypoint-initdb.d/08-ml_ranking.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siliconpilot

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-1Anurag2Basistha}@db:5432/siliconpilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./datasheets:/app/datasheets
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - siliconpilot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  siliconpilot:
    driver: bridge

volumes:
  postgres_data:

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareGenius - Engineering Grade</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #475569;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            line-height: 1.5;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-family: inherit;
            resize: vertical;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .part-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #fff;
        }

        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .mpn {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .score {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .evidence-viewer {
            margin-top: 1rem;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 6px;
        }

        .evidence-img {
            max-width: 100%;
            border: 1px solid #cbd5e1;
            margin-top: 0.5rem;
        }

        .highlight-box {
            border: 2px solid red;
            background: rgba(255, 0, 0, 0.1);
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>HardwareGenius</h1>
        <p>Engineering-Grade Component Recommendations & Evidence</p>
    </div>

    <div class="grid">
        <!-- Left Column: Input & Controls -->
        <div class="left-col">
            <div class="card">
                <h2>1. Requirements</h2>
                <textarea id="intentInput" rows="4"
                    placeholder="Describe your system (e.g., 'Need a constrained STM32 for a standard CAN motor controller with 512KB flash')"></textarea>
                <button onclick="parseRequirements()">Analyze Requirements</button>
            </div>

            <div class="card" id="specCard" style="display: none;">
                <h2>2. Specification</h2>
                <div id="specList"></div>
            </div>

            <div class="card" id="questionsCard" style="display: none;">
                <h2>3. Refinement</h2>
                <div id="questionsList"></div>
                <button onclick="submitAnswers()" style="margin-top: 1rem;">Update Spec</button>
            </div>

            <div class="card">
                <h2>Admin</h2>
                <button onclick="triggerIngestion()" style="background-color: #475569;">Trigger Ingestion</button>
                <div id="adminStatus" style="margin-top: 0.5rem; font-size: 0.9rem; color: #64748b;"></div>
            </div>
        </div>

        <!-- Right Column: Results -->
        <div class="right-col">
            <div class="card">
                <h2>Recommended Components</h2>
                <div id="resultsList">
                    <p style="color: #64748b; text-align: center;">enter requirements to see candidates</p>
                </div>
            </div>
        </div>
    </div>

    <!-- PIN MUX SECTION -->
    <div class="card">
        <h2>Pin Mux Solver</h2>
        <div class="grid">
            <div>
                <label for="pm-part-id">Part ID (from Search)</label>
                <input type="text" id="pm-part-id" placeholder="UUID..."
                    style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">

                <h3>Requirements</h3>
                <div id="pm-reqs">
                    <div class="req-row" style="margin-bottom: 0.5rem;">
                        <select class="req-type">
                            <option value="uart">UART</option>
                            <option value="spi">SPI</option>
                            <option value="i2c">I2C</option>
                            <option value="adc">ADC</option>
                        </select>
                        <input type="text" class="req-name" placeholder="Name (e.g. USART1_TX)">
                    </div>
                </div>
                <button onclick="addReqRow()">+ Add Requirement</button>
                <br><br>
                <button onclick="solvePinMux()">Solve Pin Mux</button>
            </div>

            <div>
                <h3>Results</h3>
                <pre id="pm-results"
                    style="background: #f1f5f9; padding: 1rem; border-radius: 8px; overflow: auto; max-height: 400px;">No solution yet.</pre>
            </div>
        </div>
    </div>

    <script>
        let currentSpecId = null;

        async function parseRequirements() {
            const text = document.getElementById('intentInput').value;
            if (!text) return;

            setLoading(true);
            try {
                const res = await fetch('/spec/from_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();

                currentSpecId = data.spec_id;
                renderSpec(data.spec);

                // If parses immediately to candidates, fetch them
                if (data.candidates_count > 0) {
                    await fetchRecommendations();
                }

                // If questions, show them
                if (data.questions && data.questions.questions.length > 0) {
                    renderQuestions(data.questions.questions);
                } else {
                    document.getElementById('questionsCard').style.display = 'none';
                }

            } catch (e) {
                alert('Error: ' + e.message);
            }
            setLoading(false);
        }

        async function fetchRecommendations() {
            const res = await fetch('/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ spec_id: currentSpecId })
            });
            const data = await res.json();
            renderCandidates(data.candidates);
        }

        async function triggerIngestion() {
            const btn = event.target;
            btn.disabled = true;
            document.getElementById('adminStatus').innerText = "Starting ingestion...";
            try {
                const res = await fetch('/admin/ingest', { method: 'POST' });
                const data = await res.json();
                document.getElementById('adminStatus').innerText = "✓ " + data.status;
            } catch (e) {
                document.getElementById('adminStatus').innerText = "Error: " + e.message;
            }
            setTimeout(() => btn.disabled = false, 2000);
        }

        function renderSpec(spec) {
            const list = document.getElementById('specList');
            let html = '';

            // Hard constraints
            for (const [k, v] of Object.entries(spec.hard_constraints)) {
                html += `<div class="spec-item"><span>${k}</span><strong>${v}</strong></div>`;
            }
            // Unknowns
            if (spec.unknowns.length > 0) {
                html += `<div class="spec-item" style="color: #ef4444;"><span>Missing</span><strong>${spec.unknowns.join(', ')}</strong></div>`;
            }

            list.innerHTML = html;
            document.getElementById('specCard').style.display = 'block';
        }

        function renderQuestions(questions) {
            const list = document.getElementById('questionsList');
            list.innerHTML = questions.map((q, idx) => `
                <div style="margin-bottom: 1rem;">
                    <label style="display:block; font-weight:600; margin-bottom:0.25rem;">${q.question_text}</label>
                    <small style="color:#64748b; display:block; margin-bottom:0.5rem;">${q.why_asking}</small>
                    <input type="text" id="q_${idx}" data-qid="${q.id}" style="width:100%; padding:0.5rem; border:1px solid #cbd5e1; border-radius:4px;">
                </div>
            `).join('');
            document.getElementById('questionsCard').style.display = 'block';
        }

        function renderCandidates(candidates) {
            const container = document.getElementById('resultsList');
            if (!candidates || candidates.length === 0) {
                container.innerHTML = '<p>No candidates found matching constraints.</p>';
                return;
            }

            container.innerHTML = candidates.map(c => {
                // Generate evidence items
                const evidenceHtml = c.evidence_ids.map(eid => `
                    <div style="margin-top:0.5rem; font-size:0.85em;">
                        <a href="/evidence/${eid}/content" target="_blank" style="color:var(--primary);">View Evidence Snippet</a>
                    </div>
                `).join('');

                return `
                <div class="part-card">
                    <div class="part-header">
                        <span class="mpn">${c.mpn}</span>
                        <span class="score">${c.total_score.toFixed(1)}</span>
                    </div>
                    <div style="color: #475569; font-size: 0.9rem; margin-bottom: 0.5rem;">
                        ${c.manufacturer} | ${c.family || ''} | ${c.specs.package_family || 'PKG?'}
                    </div>
                    <div class="specs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; font-size:0.9rem;">
                        <div>Flash: ${c.specs.flash_kb}KB</div>
                        <div>RAM: ${c.specs.sram_kb}KB</div>
                        <div>CAN: ${c.specs.can_count}</div>
                        <div>Freq: ${c.specs.max_mhz}MHz</div>
                    </div>
                    ${evidenceHtml ? `<div class="evidence-viewer"><strong>Evidence:</strong>${evidenceHtml}</div>` : ''}
                </div>
            `}).join('');
        }

        function setLoading(isLoading) {
            document.body.classList.toggle('loading', isLoading);
        }

        // --- PIN MUX FUNCTIONS ---
        function addReqRow() {
            const div = document.createElement('div');
            div.className = 'req-row';
            div.style.marginBottom = '0.5rem';
            div.innerHTML = `
                <select class="req-type">
                    <option value="uart">UART</option>
                    <option value="spi">SPI</option>
                    <option value="i2c">I2C</option>
                    <option value="adc">ADC</option>
                </select>
                <input type="text" class="req-name" placeholder="Name (e.g. USART1_TX)">
            `;
            document.getElementById('pm-reqs').appendChild(div);
        }

        async function solvePinMux() {
            const partId = document.getElementById('pm-part-id').value;
            if (!partId) return alert("Enter Part ID");

            const reqs = [];
            document.querySelectorAll('.req-row').forEach(row => {
                const type = row.querySelector('.req-type').value;
                const name = row.querySelector('.req-name').value;
                if (name) {
                    reqs.push({
                        function_type: type,
                        function_name: name,
                        required: true
                    });
                }
            });

            const res = document.getElementById('pm-results');
            res.textContent = "Solving...";

            try {
                const response = await fetch(`/api/parts/${partId}/solve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reqs)
                });

                const data = await response.json();
                res.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                res.textContent = "Error: " + e;
            }
        }

        async function calcPower() {
            const partId = document.getElementById('pm-part-id').value; // Reuse part ID input
            if (!partId) return alert("Enter Part ID in Pin Mux section");

            const run = parseFloat(document.getElementById('pwr-run').value);
            const sleep = parseFloat(document.getElementById('pwr-sleep').value);
            const stop = parseFloat(document.getElementById('pwr-stop').value);

            const res = document.getElementById('pwr-results');
            res.textContent = "Calculating...";

            try {
                const response = await fetch(`/api/parts/${partId}/power`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        run_percent: run,
                        sleep_percent: sleep,
                        stop_percent: stop,
                        peripherals: []
                    })
                });

                const data = await response.json();
                res.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                res.textContent = "Error: " + e;
            }
        }
    </script>
</body>

</html>
